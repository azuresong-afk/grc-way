<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Шрифты документов комплекта «Аттестации» (задача 3.2) для LibreOffice в образе app.

  PT Astra Serif метрически совместим с Times New Roman: если файлов шрифта нет
  в образе (backend/fonts/*.ttf не положили), PDF собирается с Liberation Serif —
  та же ширина строк и разбиение на страницы. DOCX при этом хранит имя
  «PT Astra Serif», и на компьютере со шрифтом (Astra Linux, установленный
  пакет) документ открывается им.
-->
<fontconfig>
  <alias binding="same">
    <family>PT Astra Serif</family>
    <prefer>
      <family>PT Astra Serif</family>
      <family>Liberation Serif</family>
      <family>Times New Roman</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Inter</family>
    <prefer>
      <family>Inter</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
</fontconfig>
