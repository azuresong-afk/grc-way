# SPA + прокси /api/* → app:8000 с отрезанием префикса. Один origin, без CORS.
# Заголовки безопасности повторены в каждом location: add_header не наследуется,
# если в location есть свой add_header.
server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 55m;  # доказательства до 50 МБ + запас на multipart

  location /api/ {
    proxy_pass http://app:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
