# Типовые формулировки организационно-распорядительных документов (ОРД)
# комплекта аттестации — задача 3.2.
#
# Это рабочие формулировки «Аттестации», а не нормативный текст: они задают
# структуру и минимальное содержание каждого документа, чтобы методист правил
# готовый проект, а не писал с нуля. До сверки методистом (origin: stub,
# verified: false) документ «Организационно-распорядительные документы»
# формируется с водяным знаком «Проект» и списком несверенных записей.
#
# Поля раздела:
#   code       — ключ раздела;
#   title      — заголовок документа в комплекте;
#   purpose    — назначение (первый абзац);
#   paragraphs — пункты документа (нумеруются в шаблоне);
#   measures   — меры набора объекта, которые документ регламентирует, по
#                профилю (fstec-117 — мероприятия МРП и меры; fstec-21, fstec-239 —
#                меры приказа). В документе выводятся с текущим статусом.
#
# В тексте можно использовать только обычный текст: подстановок нет, данные
# объекта (наименование, ответственные, класс, хосты) выводит шаблон.

version: "ord-stub-1"
origin: stub
verified: false
source:
  note: >-
    Структура комплекта — по п. 5 раздела «Комплект документов» ТЗ (docs/brief.md):
    политика, положение о разграничении доступа, инструкции администратора
    безопасности и пользователя, порядки управления конфигурацией, уязвимостями
    и обновлениями, реагирования на инциденты, резервного копирования; для №117 —
    по мероприятиям МРП. Формулировки требуют сверки с текстами приказов и
    методическим документом ФСТЭК России от 12.04.2026.

sections:
  - code: policy
    title: Политика защиты информации
    purpose: >-
      Политика определяет цели, принципы и порядок обеспечения защиты информации,
      обрабатываемой в информационной системе, и обязательна для всех работников,
      допущенных к работе в ней.
    paragraphs:
      - Цель защиты информации — исключение неправомерного доступа, уничтожения, модифицирования, блокирования, копирования и распространения информации, а также иных неправомерных действий в отношении неё.
      - Защита информации обеспечивается реализацией организационных и технических мер, определённых для класса (уровня защищённости, категории) информационной системы с учётом актуальных угроз безопасности информации.
      - Состав мер, их адаптация и обоснование исключений фиксируются в наборе мер информационной системы и пересматриваются при изменении её состава, условий функционирования или угроз.
      - Ответственность за организацию защиты информации несёт руководитель оператора; выполнение мер обеспечивают лица, ответственные за защиту информации, и администратор безопасности.
      - Пересмотр политики проводится не реже одного раза в год, а также после значимых изменений информационной системы и по результатам контроля уровня защищённости.
    measures:
      fstec-117: [ВУ, ПК]
      fstec-21: []
      fstec-239: [ПЛН.0, ПЛН.1, ПЛН.2]

  - code: access
    title: Положение о разграничении прав доступа
    purpose: >-
      Положение устанавливает правила предоставления, изменения и прекращения
      доступа пользователей и администраторов к ресурсам информационной системы.
    paragraphs:
      - Доступ предоставляется на основании заявки, согласованной руководителем подразделения и лицом, ответственным за защиту информации, в объёме, минимально необходимом для выполнения должностных обязанностей.
      - Каждому пользователю присваивается персональный идентификатор; использование групповых и общих учётных записей не допускается, кроме случаев, обоснованных в описании информационной системы.
      - Полномочия пользователей, администраторов и лиц, обеспечивающих функционирование системы, разделяются; привилегированный доступ предоставляется отдельной учётной записью.
      - При увольнении или переводе работника учётная запись блокируется в день получения уведомления, права доступа пересматриваются.
      - Перечень ролей и матрица доступа к ресурсам ведутся лицом, ответственным за защиту информации, и пересматриваются не реже одного раза в полгода.
    measures:
      fstec-117: [ПД, УПД.1, УПД.2, УПД.3, УПД.4, УПД.5, ИАФ.1, ИАФ.2, ИАФ.3, ИАФ.4]
      fstec-21: [УПД.1, УПД.2, УПД.4, УПД.5, ИАФ.1, ИАФ.3, ИАФ.4]
      fstec-239: [УПД.0, УПД.1, УПД.2, УПД.4, УПД.5, ИАФ.0, ИАФ.1, ИАФ.3, ИАФ.4]

  - code: admin
    title: Инструкция администратора безопасности
    purpose: >-
      Инструкция определяет обязанности и порядок действий администратора
      безопасности информационной системы.
    paragraphs:
      - Администратор безопасности ведёт учётные записи и права доступа в соответствии с положением о разграничении прав доступа и контролирует их соответствие матрице доступа.
      - Администратор безопасности обеспечивает работоспособность и настройку средств защиты информации, контролирует сроки действия их сертификатов и обновление баз признаков.
      - Администратор безопасности ежедневно просматривает журналы событий безопасности, анализирует события, указывающие на возможный инцидент, и действует по порядку реагирования на инциденты.
      - Администратор безопасности участвует в контроле конфигураций, управлении уязвимостями и обновлениями, резервном копировании в соответствии с соответствующими порядками.
      - Администратору безопасности запрещается передавать свои аутентификационные данные и выполнять действия, не связанные с его обязанностями, от имени привилегированной учётной записи.
    measures:
      fstec-117: [МБ, РСБ.1, РСБ.2, РСБ.3, РСБ.4, РСБ.5, АВЗ.1, АВЗ.2, АВЗ.3, АВЗ.4]
      fstec-21: [РСБ.1, РСБ.3, РСБ.5, АВЗ.1, АВЗ.2]
      fstec-239: [АУД.4, АУД.6, АУД.7, АВЗ.0, АВЗ.1, АВЗ.4]

  - code: user
    title: Инструкция пользователя
    purpose: >-
      Инструкция определяет правила работы пользователя в информационной системе
      и его обязанности по защите информации.
    paragraphs:
      - Пользователь работает только под своей учётной записью, не сообщает пароль и не передаёт средства аутентификации другим лицам.
      - Пользователь блокирует рабочее место при уходе и не оставляет без присмотра носители информации.
      - Пользователю запрещается устанавливать программное обеспечение, подключать личные устройства и съёмные носители, если это не разрешено администратором безопасности.
      - Пользователь сообщает администратору безопасности о подозрительных сообщениях, сбоях средств защиты, попытках доступа к его учётной записи и иных признаках инцидента.
      - Пользователь проходит инструктаж по защите информации при допуске к работе и далее не реже одного раза в год.
    measures:
      fstec-117: [УЗ, ЗУ, МУ, УД]
      fstec-21: [УПД.7, УПД.10]
      fstec-239: [УПД.7, УПД.10]

  - code: config
    title: Порядок управления конфигурацией
    purpose: >-
      Порядок определяет, как вносятся, согласуются и контролируются изменения
      конфигурации информационной системы и её системы защиты информации.
    paragraphs:
      - Базовая конфигурация (состав технических средств и программного обеспечения, параметры настройки средств защиты) документируется и хранится у лица, ответственного за защиту информации.
      - Изменение конфигурации выполняется по заявке с оценкой влияния на защищённость; изменения, затрагивающие средства защиты информации, согласуются с администратором безопасности.
      - Устанавливается только программное обеспечение из утверждённого перечня; отклонения выявляются при контроле конфигураций.
      - Контроль соответствия конфигурации базовой проводится автоматизированными средствами не реже одного раза в квартал и после каждого значимого изменения; результаты фиксируются.
    measures:
      fstec-117: [КК]
      fstec-21: [УКФ.1, УКФ.2, УКФ.3, УКФ.4]
      fstec-239: [УКФ.0, УКФ.1, УКФ.2, УКФ.3, УКФ.4]

  - code: vulns
    title: Порядок управления уязвимостями и обновлениями
    purpose: >-
      Порядок определяет выявление уязвимостей программных и программно-аппаратных
      средств информационной системы, оценку их критичности, сроки и способы
      устранения, а также получение, тестирование и установку обновлений.
    paragraphs:
      - Уязвимости выявляются сканированием защищённости по графику, по бюллетеням разработчиков, по банку данных угроз безопасности информации ФСТЭК России (БДУ) и по результатам контроля защищённости (тестирование на проникновение, учения).
      - Уровень критичности каждой выявленной уязвимости определяется по Методике оценки уровня критичности уязвимостей программных, программно-аппаратных средств (ФСТЭК России, 30.06.2025) с учётом влияния уязвимости на информационную систему.
      - Сроки устранения устанавливаются по уровню критичности от даты оценки (таблица ниже); уязвимостям сертифицированных средств защиты информации присваивается критический уровень.
      - Уязвимость устраняется установкой обновления, а при его отсутствии или невозможности установки — компенсирующими мерами; обновления зарубежного и свободно распространяемого программного обеспечения перед установкой тестируются по Методике тестирования обновлений безопасности (ФСТЭК России, 2022).
      - Повторная оценка проводится при изменении сведений об уязвимости в БДУ, при изменении состава или условий функционирования системы; устранение подтверждается повторным сканированием.
    measures:
      fstec-117: [КУ, КО]
      fstec-21: [АНЗ.1, АНЗ.2]
      fstec-239: [АУД.2, ОПО.0, ОПО.1, ОПО.2, ОПО.3, ОПО.4]

  - code: incidents
    title: Порядок выявления инцидентов и реагирования на них
    purpose: >-
      Порядок определяет выявление, регистрацию, анализ инцидентов безопасности
      информации, устранение их последствий и предотвращение повторения.
    paragraphs:
      - Признаки инцидента выявляются по событиям безопасности, сообщениям пользователей, средств защиты информации и внешних источников.
      - Каждый инцидент регистрируется в журнале с указанием времени выявления, затронутых ресурсов, лиц, принявших меры, и принятых мер.
      - О выявленном инциденте немедленно информируются лицо, ответственное за защиту информации, и руководитель оператора; при необходимости — уполномоченные органы в установленном порядке.
      - После устранения последствий проводится анализ причин и принимаются меры по предотвращению повторения инцидента; результаты учитываются при пересмотре модели угроз.
    measures:
      fstec-117: [МБ]
      fstec-21: [ИНЦ.1, ИНЦ.2, ИНЦ.3, ИНЦ.4, ИНЦ.5, ИНЦ.6]
      fstec-239: [ИНЦ.0, ИНЦ.1, ИНЦ.2, ИНЦ.3, ИНЦ.4, ИНЦ.5, ИНЦ.6]

  - code: backup
    title: Порядок резервного копирования и восстановления
    purpose: >-
      Порядок определяет состав резервируемых данных, периодичность резервного
      копирования, хранение копий и восстановление информационной системы после
      сбоев и нештатных ситуаций.
    paragraphs:
      - Резервному копированию подлежат базы данных, конфигурации технических средств и средств защиты информации, журналы событий безопасности и программное обеспечение, необходимое для восстановления.
      - Периодичность копирования и срок хранения копий устанавливаются для каждого ресурса исходя из допустимой потери данных; копии хранятся отдельно от основных ресурсов и защищаются от несанкционированного доступа.
      - Восстановление из резервных копий проверяется не реже одного раза в полгода; результаты проверки фиксируются.
      - Действия персонала при нештатных ситуациях и порядок восстановления описываются в плане обеспечения непрерывности функционирования.
    measures:
      fstec-117: [НФ]
      fstec-21: [ОДТ.4, ОДТ.5]
      fstec-239: [ОДТ.0, ОДТ.4, ОДТ.5, ДНС.0, ДНС.1, ДНС.5]
