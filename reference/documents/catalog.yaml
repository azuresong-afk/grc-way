  - code: org-docs
    title: Организационно-распорядительные документы
    description: >-
      Политика, положение о разграничении прав доступа, инструкции администратора
      безопасности и пользователя, порядки управления конфигурацией, уязвимостями и
      обновлениями (со ссылкой на Методику 2025 и таблицей уровней), реагирования на
      инциденты, резервного копирования. Типовой текст — reference/documents/org-docs.yaml,
      меры объекта по каждому документу — с текущим статусом.
    template: org-docs.docx
    regimes: ["117", "21", "239"]
    fields:
      - {key: customer.name, title: Заказчик, source: "Проект → заказчик → наименование", tab: project, required: true}
      - {key: object.name, title: Наименование объекта, source: "Объект → Описание → наименование", tab: description, required: true}
      - {key: object.responsible, title: Ответственные лица, source: "Объект → Описание → ответственные", tab: description, required: true}
      - {key: org.sections, title: Типовые формулировки ОРД, source: "reference/documents/org-docs.yaml", tab: project, required: true}
      - {key: measures.groups, title: Набор мер после адаптации, source: "Объект → Меры → базовый набор и адаптация", tab: measures, required: true}
      - {key: vulns.methodology.version, title: Методика оценки критичности уязвимостей, source: "Справочники → Методика критичности уязвимостей 2025", tab: vulns, required: true}

  - code: test-program
