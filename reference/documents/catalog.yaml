      - {key: measures.groups, title: Набор мер после адаптации, source: "Объект → Меры → базовый набор и адаптация", tab: measures, required: true}
      - {key: hosts, title: Хосты, source: "Объект → Состав → хосты (вручную и из активов «Сканера»)", tab: composition, required: true}
