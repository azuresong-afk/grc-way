      - {key: threat_model.relevant_threats, title: Актуальные угрозы, source: "Объект → Угрозы → угрозы БДУ, решение «актуальна»", tab: threats, required: true}
      - {key: measures.groups, title: Набор мер после адаптации, source: "Объект → Меры → базовый набор и адаптация", tab: measures, required: true}
      - {key: measures.adaptation.approved, title: Утверждение адаптации, source: "Объект → Меры → адаптация → утверждение", tab: measures, required: true}
      - {key: szi, title: Средства защиты информации, source: "Объект → СЗИ", tab: szi, required: true}
      - {key: object.interconnections, title: Взаимодействие с другими системами, source: "Объект → Описание → взаимодействие", tab: description}

