      - {key: vulns.rows, title: Оценки критичности уязвимостей, source: "Объект → Уязвимости → реестр (находки «Сканера» и контроль защищённости)", tab: vulns}
      - {key: "vulns.rows[].v", title: Уровень V, source: "Объект → Уязвимости → оценка", tab: vulns, required: true}

  - code: conclusion
    title: Заключение по результатам аттестационных испытаний
    description: >-
      Итоги испытаний: процент реализации мер (авто / вручную / всего), несоответствия,
