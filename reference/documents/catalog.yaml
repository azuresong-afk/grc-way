# Каталог документов комплекта (задача 3.1 — движок, 3.2 — девять документов из ТЗ).
#
# Для каждого документа: шаблон в templates/docx/, для каких режимов он нужен и
# какие данные в него попадают. Поле fields — карта «из каких данных собран»:
#   key      — путь в контексте документа (app/docs_gen/context.py);
#              «список[].поле» — поле у каждого элемента списка;
#   title    — как поле называется в документе;
#   source   — откуда берётся (экран и поле), показывается пользователю;
#   tab      — вкладка карточки объекта, где поле заполняют
#              (project | description | classification | composition | szi |
#              measures | threats | vulns);
#   required — без поля документ формально неполон: оно подсвечивается в карте,
#              в документе на его месте — «[не заполнено: …]».
# titles — заголовок по режиму (117 | 21 | 239), если он отличается.
# Порядок документов — как в ТЗ (docs/brief.md, «Комплект документов»).
# Формулировки шаблонов — рабочие, не нормативный текст: структура документов
# требует сверки с ГОСТ Р 51583-2014, приказом ФСТЭК России №77 и текстами
# приказов №117 / №21 / №239. Типовой текст ОРД — reference/documents/org-docs.yaml.
#
# Документ выводит только те разделы контекста, которые использует его шаблон:
# от них считается хэш версии и по ним ставится водяной знак за несверенные
# записи справочников.

documents:
  - code: classification-act
    title: Акт классификации
    titles:
      "117": Акт классификации государственной информационной системы
      "21": Акт определения уровня защищённости персональных данных
      "239": Сведения о результатах присвоения категории значимости
    description: >-
      Исходные данные и результат классификации: класс защищённости ГИС, уровень
      защищённости ПДн или категория значимости объекта КИИ с шагами расчёта и
      строками таблицы. Собирается из утверждённого расчёта на вкладке «Классификация».
    template: classification-act.docx
    regimes: ["117", "21", "239"]
    fields:
      - {key: customer.name, title: Заказчик, source: "Проект → заказчик → наименование", tab: project, required: true}
      - {key: object.name, title: Наименование объекта, source: "Объект → Описание → наименование", tab: description, required: true}
      - {key: object.kind_title, title: Тип объекта, source: "Объект → Описание → тип", tab: description, required: true}
      - {key: object.purpose, title: Назначение, source: "Объект → Описание → назначение", tab: description, required: true}
      - {key: classification.result_label, title: Класс / уровень / категория, source: "Объект → Классификация → утверждённый расчёт", tab: classification, required: true}
      - {key: classification.approved, title: Дата утверждения классификации, source: "Объект → Классификация → утверждение", tab: classification, required: true}
      - {key: classification.approved_by, title: Кто утвердил классификацию, source: "Объект → Классификация → утверждение", tab: classification, required: true}
      - {key: classification.steps, title: Шаги расчёта, source: "Объект → Классификация → расчёт по таблице", tab: classification, required: true}
      - {key: classification.justification, title: Обоснование, source: "Объект → Классификация → обоснование", tab: classification}
      - {key: object.responsible, title: Ответственные лица, source: "Объект → Описание → ответственные", tab: description, required: true}

  - code: threat-model
    title: Модель угроз безопасности информации
    description: >-
      Структура по Методике оценки угроз 2021: негативные последствия, объекты
      воздействия, нарушители, способы реализации, сценарии и перечень актуальных угроз
      БДУ с обоснованием. Берётся утверждённая версия модели, без неё — последний черновик.
    template: threat-model.docx
    regimes: ["117", "21", "239", null]
    fields:
      - {key: customer.name, title: Заказчик, source: "Проект → заказчик → наименование", tab: project, required: true}
      - {key: object.name, title: Наименование объекта, source: "Объект → Описание → наименование", tab: description, required: true}
      - {key: object.purpose, title: Назначение, source: "Объект → Описание → назначение", tab: description, required: true}
      - {key: object.boundaries, title: Границы объекта, source: "Объект → Описание → границы", tab: description, required: true}
      - {key: threat_model.version, title: Модель угроз, source: "Объект → Угрозы → версия модели", tab: threats, required: true}
      - {key: threat_model.approved, title: Утверждение модели угроз, source: "Объект → Угрозы → утверждение", tab: threats, required: true}
      - {key: threat_model.consequences, title: Негативные последствия, source: "Объект → Угрозы → шаг «Последствия»", tab: threats, required: true}
      - {key: threat_model.objects, title: Объекты воздействия, source: "Объект → Угрозы → шаг «Объекты воздействия»", tab: threats, required: true}
      - {key: threat_model.intruders, title: Нарушители, source: "Объект → Угрозы → шаг «Нарушители»", tab: threats, required: true}
      - {key: threat_model.methods, title: Способы реализации угроз, source: "Объект → Угрозы → шаг «Способы»", tab: threats, required: true}
      - {key: threat_model.scenarios, title: Сценарии (тактики), source: "Объект → Угрозы → шаг «Сценарии»", tab: threats, required: true}
      - {key: threat_model.relevant_threats, title: Актуальные угрозы, source: "Объект → Угрозы → угрозы БДУ, решение «актуальна»", tab: threats, required: true}
      - {key: "threat_model.threats[].justification", title: Обоснование решения по угрозе, source: "Объект → Угрозы → угроза → обоснование", tab: threats, required: true}
      - {key: threat_model.threats, title: Рассмотренные угрозы БДУ, source: "Объект → Угрозы → угрозы БДУ", tab: threats, required: true}

  - code: protection-spec
