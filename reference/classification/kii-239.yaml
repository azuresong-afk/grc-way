# Категорирование объекта КИИ: категория значимости 1–3.
#
# ВНИМАНИЕ: официальный текст ПП РФ от 08.02.2018 №127 (перечень показателей
# критериев значимости и их значений) в проект ещё не загружен. Это заглушка:
# пороговые значения показателей не заданы — методист определяет категорию по
# каждой группе показателей сам и вносит её в мастер; мастер берёт наивысшую
# категорию (по Правилам категорирования объекту присваивается наивысшая из
# категорий по показателям). После загрузки текста группы заменяются
# отдельными показателями с порогами.
# Формат — см. gis-117.yaml.

regime: "239"
title: Категория значимости объекта КИИ
version: "127-stub-1"
origin: stub
source:
  document: Постановление Правительства РФ от 08.02.2018 №127
  clause: Перечень показателей критериев значимости; Правила категорирования
  note: >-
    Заглушка до загрузки официального текста: показатели сгруппированы по
    видам значимости без пороговых значений.

groups:
  - {key: indicators, title: Показатели значимости}

inputs:
  - key: social
    group: indicators
    label: Социальная значимость
    help: Наивысшая категория среди показателей раздела I перечня (ущерб жизни и здоровью, нарушение жизнеобеспечения, транспорта, связи, доступности госуслуг).
    options: &cat
      - {value: "1", label: Первая категория}
      - {value: "2", label: Вторая категория}
      - {value: "3", label: Третья категория}
      - {value: none, label: Не достигает порогов}
  - key: political
    group: indicators
    label: Политическая значимость
    help: Наивысшая категория среди показателей раздела II перечня.
    options: *cat
  - key: economic
    group: indicators
    label: Экономическая значимость
    help: Наивысшая категория среди показателей раздела III перечня.
    options: *cat
  - key: ecological
    group: indicators
    label: Экологическая значимость
    help: Наивысшая категория среди показателей раздела IV перечня.
    options: *cat
  - key: defense
    group: indicators
    label: Значимость для обороны, безопасности и правопорядка
    help: Наивысшая категория среди показателей раздела V перечня.
    options: *cat

steps:
  - key: category
    label: Категория значимости
    method: max
    fields: [social, political, economic, ecological, defense]
    order: ["1", "2", "3", none]
    source: {clause: "Правила категорирования — наивысшая из категорий по показателям"}

result:
  key: category
  label: Категория значимости
  values:
    - {value: "1", label: Первая категория, short: Кат. 1}
    - {value: "2", label: Вторая категория, short: Кат. 2}
    - {value: "3", label: Третья категория, short: Кат. 3}
    - {value: none, label: Категория не присваивается, short: Без категории}
