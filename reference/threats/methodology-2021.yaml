# Справочник Методики оценки угроз безопасности информации (ФСТЭК России, 05.02.2021):
# виды негативных последствий У1–У3 и их примеры, уровни возможностей нарушителей
# Н1–Н4, виды нарушителей, тактики и техники.
#
# ВНИМАНИЕ: официальный текст Методики в проект ещё не загружен. Записи
# заполнены по памяти разработчика о структуре Методики: формулировки близки к
# тексту, но не сверены с ним, а описания уровней Н1–Н4 — краткое изложение, а
# не цитата. Все записи — origin=stub, без отметки о сверке: в интерфейсе
# «требует сверки», в документах — водяной знак «Проект». Методист сверяет каждую
# запись с текстом и исправляет её в интерфейсе («Справочники → Методика оценки
# угроз») или в этом файле.
#
# Техники (приложение 11) не заполнены: их около полутора сотен, и без текста
# Методики их не воспроизвести без ошибок. После загрузки текста их добавят в
# этот файл или в интерфейсе («Добавить технику»).
#
# Коды У1–У3, Н1–Н4 и Т1–Т10 — из Методики. Коды примеров последствий (У1.1, …)
# и видов нарушителей (НВ1, …) — нумерация «Аттестации» по порядку строк таблиц,
# в Методике их нет.
#
# Формат:
#   document — документ-источник, подставляется в source каждой записи
#   sections — разделы справочника; у раздела kind и записи items
#   запись   — code, title, description (необязательно), source (пункт,
#              приложение, примечание — поверх document), attrs (данные вида:
#              у нарушителя — capability и типовая категория), children
#              (вложенные записи: примеры последствий, техники тактики)

version: "2021-stub-1"
origin: stub
document:
  document: Методика оценки угроз безопасности информации (утв. ФСТЭК России 05.02.2021)
  url: https://fstec.ru/dokumenty/vse-dokumenty/spetsialnye-normativnye-dokumenty/metodicheskij-dokument-ot-5-fevralya-2021-g
  note: Текст не загружен в проект; запись не сверена с ним.

sections:
  - kind: consequence_type
    child_kind: consequence
    source: {clause: "раздел 4, таблица 1", appendix: "4"}
    items:
      - code: У1
        title: Ущерб физическому лицу
        children:
          - Угроза жизни или здоровью
          - Унижение достоинства личности
          - Нарушение свободы, личной неприкосновенности
          - Нарушение неприкосновенности частной жизни
          - Нарушение личной, семейной тайны, утрата чести и доброго имени
          - Нарушение тайны переписки, телефонных переговоров, иных сообщений
          - Нарушение иных прав и свобод гражданина, закреплённых в Конституции Российской Федерации и федеральных законах
          - Финансовый, иной материальный ущерб физическому лицу
          - Нарушение конфиденциальности (утечка) персональных данных
          - «Травля» гражданина в сети «Интернет»
          - Разглашение персональных данных граждан
      - code: У2
        title: Риски юридическому лицу, индивидуальному предпринимателю, связанные с хозяйственной деятельностью
        children:
          - Нарушение законодательства Российской Федерации
          - Потеря (хищение) денежных средств
          - Недополучение ожидаемой (прогнозируемой) прибыли
          - Необходимость дополнительных (незапланированных) затрат на выплаты штрафов (неустоек) или компенсаций
          - Необходимость дополнительных (незапланированных) затрат на закупку товаров, работ или услуг (в том числе закупка программного обеспечения, технических средств, вышедших из строя, замена, настройка, ремонт указанных средств)
          - Нарушение штатного режима функционирования автоматизированной системы управления и управляемого объекта и (или) процесса
          - Срыв запланированной сделки с партнёром
          - Необходимость дополнительных (незапланированных) затрат на восстановление деятельности
          - Потеря клиентов, поставщиков
          - Потеря конкурентного преимущества
          - Невозможность заключения договоров, соглашений
          - Нарушение деловой репутации
          - Снижение престижа
          - Дискредитация работников
          - Утрата доверия
          - Причинение имущественного ущерба
          - Неспособность выполнения договорных обязательств
          - Невозможность решения задач (реализации функций) или снижение эффективности решения задач (реализации функций)
          - Необходимость изменения (перестроения) внутренних процедур для достижения целей, решения задач (реализации функций)
          - Принятие неправомерных решений
          - Простой информационной системы или сети
          - Публикация недостоверной информации на веб-ресурсах организации
          - Использование веб-ресурсов для распространения и управления вредоносным программным обеспечением
          - Рассылка информационных сообщений с использованием вычислительных мощностей оператора и (или) от его имени
          - Утечка конфиденциальной информации (коммерческой тайны, секретов производства (ноу-хау) и др.)
      - code: У3
        title: Ущерб государству в области обеспечения обороны страны, безопасности государства и правопорядка, а также в социальной, экономической, политической, экологической сферах деятельности
        children:
          - Причинение ущерба жизни и здоровью людей
          - Прекращение или нарушение функционирования объектов обеспечения жизнедеятельности населения
          - Прекращение или нарушение функционирования объектов транспортной инфраструктуры
          - Прекращение или нарушение функционирования государственных органов, органов местного самоуправления
          - Нарушение условий международного договора Российской Федерации, срыв переговоров или подписания планируемого международного договора Российской Федерации
          - Снижение уровня дохода государственной корпорации, государственной организации или организации с преобладающим участием государства
          - Возникновение ущерба бюджетам Российской Федерации
          - Прекращение или нарушение проведения клиентами операций по банковским счетам и (или) без открытия банковского счёта или операций в системно значимой кредитной организации, оператором услуг платёжной инфраструктуры системно и (или) социально значимых платёжных систем, системно значимой инфраструктурной организацией финансового рынка
          - Вредные воздействия на окружающую среду
          - Прекращение или нарушение функционирования пунктов управления (ситуационных центров)
          - Снижение показателей государственного оборонного заказа
          - Прекращение или нарушение функционирования информационной системы в области обеспечения обороны страны, безопасности государства и правопорядка
          - Нарушение законодательства Российской Федерации
          - Публикация недостоверной социально значимой информации на веб-ресурсах, которая может привести к социальной напряжённости, панике среди населения и др.
          - Нарушение штатного режима функционирования автоматизированной системы управления и управляемого объекта и (или) процесса, если это ведёт к выводу из строя технологических объектов, их компонентов
          - Нарушение общественного правопорядка, возможность потери или снижения уровня контроля за общественным правопорядком
          - Нарушение выборного процесса
          - Отсутствие возможности оперативного оповещения населения о чрезвычайной ситуации
          - Организация пикетов, забастовок, митингов и т. д.
          - Массовые увольнения
          - Увеличение количества жалоб в органы государственной власти или органы местного самоуправления
          - Появление негативных публикаций в общедоступных источниках
          - Создание предпосылок к внутриполитическому кризису
          - Доступ к персональным данным сотрудников органов государственной власти, уполномоченных в области обеспечения обороны, безопасности и правопорядка, высших должностных лиц государственных органов и других лиц государственных органов
          - Доступ к системам и сетям с целью незаконного использования вычислительных мощностей
          - Использование веб-ресурсов государственных органов для распространения и управления вредоносным программным обеспечением
          - Утечка информации ограниченного доступа
          - Непредоставление государственных услуг

  - kind: capability
    source: {clause: "раздел 5", note: "Описание — краткое изложение, не цитата."}
    items:
      - code: Н1
        title: Нарушитель, обладающий базовыми возможностями
        description: >-
          Использует только известные уязвимости, скрипты и инструменты, свободно
          распространяемые в сети «Интернет» и разработанные другими лицами;
          минимально понимает, как они работают. Компьютерные знания и навыки — на
          уровне пользователя.
      - code: Н2
        title: Нарушитель, обладающий базовыми повышенными возможностями
        description: >-
          Использует общедоступные инструменты и фреймворки, хорошо ими владеет и
          может дорабатывать их; самостоятельно планирует и реализует сценарии
          угроз; практически знает устройство систем, сетей, операционных систем и
          защитных механизмов.
      - code: Н3
        title: Нарушитель, обладающий средними возможностями
        description: >-
          Ищет и находит уязвимости, в том числе неизвестные (нулевого дня),
          самостоятельно разрабатывает средства их использования; может получить
          доступ к исходному коду и знает устройство конкретных систем.
      - code: Н4
        title: Нарушитель, обладающий высокими возможностями
        description: >-
          Создаёт методы и средства реализации угроз с привлечением
          специализированных научных организаций, в том числе для скрытного
          проникновения; привлекает специалистов уровней Н2–Н3; может воздействовать
          на программное обеспечение и аппаратные средства на этапах разработки и
          поставки, получать доступ к микрокоду и конструкторской документации.

  - kind: intruder
    source: {clause: "раздел 5, таблица видов нарушителей", note: "Соответствие уровню возможностей — типовое, для конкретной системы уточняется."}
    items:
      - {code: НВ1, title: "Специальные службы иностранных государств", attrs: {capability: Н4, category: внешний}}
      - {code: НВ2, title: "Террористические, экстремистские группировки", attrs: {capability: Н2, category: внешний}}
      - {code: НВ3, title: "Преступные группы (криминальные структуры)", attrs: {capability: Н2, category: внешний}}
      - {code: НВ4, title: "Отдельные физические лица (хакеры)", attrs: {capability: Н1, category: внешний}}
      - {code: НВ5, title: "Конкурирующие организации", attrs: {capability: Н2, category: внешний}}
      - {code: НВ6, title: "Разработчики программных, программно-аппаратных средств", attrs: {capability: Н3, category: внутренний}}
      - {code: НВ7, title: "Лица, обеспечивающие поставку программных, программно-аппаратных средств, обеспечивающих систем", attrs: {capability: Н2, category: внешний}}
      - {code: НВ8, title: "Поставщики услуг связи, вычислительных услуг", attrs: {capability: Н2, category: внутренний}}
      - {code: НВ9, title: "Лица, привлекаемые для установки, настройки, испытаний, пусконаладочных и иных видов работ", attrs: {capability: Н2, category: внутренний}}
      - {code: НВ10, title: "Лица, обеспечивающие функционирование систем и сетей или обеспечивающих систем оператора (администрация, охрана, уборщики и т. д.)", attrs: {capability: Н1, category: внутренний}}
      - {code: НВ11, title: "Авторизованные пользователи систем и сетей", attrs: {capability: Н1, category: внутренний}}
      - {code: НВ12, title: "Системные администраторы и администраторы безопасности", attrs: {capability: Н2, category: внутренний}}
      - {code: НВ13, title: "Бывшие (уволенные) работники (пользователи)", attrs: {capability: Н1, category: внешний}}

  - kind: tactic
    child_kind: technique
    source: {appendix: "11"}
    items:
      - {code: Т1, title: "Сбор информации о системах и сетях"}
      - {code: Т2, title: "Получение первоначального доступа к компонентам систем и сетей"}
      - {code: Т3, title: "Внедрение и исполнение вредоносного программного обеспечения в системах и сетях"}
      - {code: Т4, title: "Закрепление (сохранение доступа) в системе или сети"}
      - {code: Т5, title: "Управление вредоносным программным обеспечением и (или) компонентами, к которым ранее был получен доступ"}
      - {code: Т6, title: "Повышение привилегий по доступу к компонентам систем и сетей"}
      - {code: Т7, title: "Сокрытие действий и применяемых при этом средств от обнаружения"}
      - {code: Т8, title: "Получение доступа (распространение доступа) к другим компонентам систем и сетей или смежным системам и сетям"}
      - {code: Т9, title: "Сбор и вывод из системы или сети информации, необходимой для дальнейших действий при реализации угроз безопасности информации или реализации новых угроз"}
      - {code: Т10, title: "Несанкционированный доступ и (или) воздействие на информационные ресурсы или компоненты систем и сетей, приводящие к негативным последствиям"}
