# Методика оценки уровня критичности уязвимостей программных,
# программно-аппаратных средств (утв. ФСТЭК России 30.06.2025).
#
# Заполнено по официальному тексту, загруженному в проект
# (grc/normative/fstec-vuln-criticality-2025-06-30.pdf): таблица 1 — весовые
# коэффициенты и значения показателей, таблица 2 — уровни критичности, п. 21 —
# рекомендуемые сроки устранения, п. 25 — компенсирующие меры, п. 4 — уязвимости
# сертифицированных СЗИ. Наименования значений — дословно из таблицы 1.
# origin=official, но отметки о сверке методистом нет: её ставят в интерфейсе
# («Справочники → Критичность уязвимостей»).
#
# Код не содержит чисел Методики: формула V = I_cvss × I_infr × (I_at + I_imp)
# (п. 12) собирается из групп показателей — I_infr (п. 14), I_at (п. 16),
# I_imp (п. 17) — как сумма «вес × значение» показателей группы.
#
# Коды значений (K1…K8, L1…L4, P1, P2, E1…E3, H1…H12) — нумерация «Аттестации»
# по порядку строк таблицы 1, в Методике их нет.
#
# Неточности текста, отмеченные для сверки методистом (docs/roadmap.md, раздел 8):
#   - строка 1 таблицы 1 — «важных процессов», в примере 2 — «критических»;
#   - правило «наибольшее L» есть только в примере 2 со ссылкой на
#     несуществующий «подпункт 2.8»;
#   - полосы L «более 70 %», «50–70 %», «10–50 %» пересекаются на границах 50 % и
#     70 %; границы ниже записаны как в тексте, долю в полосу переводит задача 2.7.

id: fstec-2025
title: Методика оценки уровня критичности уязвимостей программных, программно-аппаратных средств
version: "2025-06-30-1"
origin: official
source:
  document: Методика оценки уровня критичности уязвимостей программных, программно-аппаратных средств (утв. ФСТЭК России 30.06.2025)
  url: https://fstec.ru/dokumenty/vse-dokumenty/spetsialnye-normativnye-dokumenty
  note: Заполнено по официальному тексту, загруженному в проект.

formula:
  text: V = I_cvss × I_infr × (I_at + I_imp)
  source: {clause: "12"}

# Значение V на экране и в документах — с двумя знаками после запятой, как в
# примерах приложения («≈ 4,75», «≈ 8,47»). Уровень определяется по тому же
# округлённому значению, чтобы число и уровень не расходились на границах.
rounding:
  digits: 2
  note: Методика округления не задаёт; два знака — как в примерах приложения. Решение «Аттестации».

cvss:
  version: "3.1"
  min: 0
  max: 10
  source: {clause: "13"}
  note: >-
    Базовая оценка CVSS 3.1 разработчика из БДУ ФСТЭК России или иных баз. Если её
    нет, специалист сам определяет версию CVSS, по которой оценивает уязвимость.

groups:
  - code: infr
    symbol: I_infr
    title: Влияние уязвимости на функционирование информационной системы
    formula: I_infr = k × K + l × L + p × P
    source: {clause: "14"}
  - code: at
    symbol: I_at
    title: Возможность эксплуатации уязвимости
    formula: I_at = e × E
    source: {clause: "16"}
  - code: imp
    symbol: I_imp
    title: Последствия эксплуатации уязвимости
    formula: I_imp = h × H
    source: {clause: "17"}

# Таблица 1. multiple: max — если показатель принимает несколько значений,
# берётся наибольшее (K — п. 15, E — п. 16, H — п. 17, L — пример 2 приложения);
# single — только одно значение.
indicators:
  - code: K
    group: infr
    weight_symbol: k
    weight: 0.5
    title: Тип компонента информационной системы, подверженного уязвимости
    multiple: max
    source: {clause: "14, 15", table: "1", row: "1"}
    values:
      - {code: K1, score: 1.1, title: "Уязвимости подвержены компоненты системы, обеспечивающие реализацию важных процессов (бизнес-процессов), функций, полномочий"}
      - {code: K2, score: 0.9, title: "Уязвимости подвержены межсетевые экраны"}
      - {code: K3, score: 0.9, title: "Уязвимости подвержены сетевые устройства и шлюзы"}
      - {code: K4, score: 0.8, title: "Уязвимости подвержено телекоммуникационное оборудование, система управления сетью передачи данных"}
      - {code: K5, score: 0.7, title: "Уязвимости подвержены серверы (центральные вычислительные узлы)"}
      - {code: K6, score: 0.5, title: "Уязвимости подвержены пользовательские устройства (автоматизированные рабочие места)"}
      - {code: K7, score: 0.4, title: "Уязвимости подвержены системы хранения данных"}
      - {code: K8, score: 0.1, title: "Уязвимости подвержены другие компоненты"}
  - code: L
    group: infr
    weight_symbol: l
    weight: 0.2
    title: Количество уязвимых компонентов информационной системы
    multiple: max
    source: {clause: "14", table: "1", row: "2", note: "Правило «наибольшее из значений» — пример 2 приложения"}
    values:
      - {code: L1, score: 1.0, share_min: 70, share_max: null, title: "Более 70% компонентов от общего числа компонентов в информационной системе"}
      - {code: L2, score: 0.8, share_min: 50, share_max: 70, title: "50-70% компонентов от общего числа компонентов в информационной системе"}
      - {code: L3, score: 0.6, share_min: 10, share_max: 50, title: "10-50% компонентов от общего числа компонентов в информационной системе"}
      - {code: L4, score: 0.5, share_min: null, share_max: 10, title: "Менее 10% компонентов от общего числа компонентов в информационной системе"}
  - code: P
    group: infr
    weight_symbol: p
    weight: 0.3
    title: Влияние на эффективность защиты периметра информационной системы
    multiple: single
    source: {clause: "14", table: "1", row: "3"}
    values:
      - {code: P1, score: 1.1, title: "Уязвимое программное, программно-аппаратное средство доступно из сети «Интернет»"}
      - {code: P2, score: 0.6, title: "Уязвимое программное, программно-аппаратное средство недоступно из сети «Интернет»"}
  - code: E
    group: at
    weight_symbol: e
    weight: 1.0
    title: Эксплуатация уязвимости
    multiple: max
    source: {clause: "16", table: "1", row: "4"}
    values:
      - {code: E1, score: 0.6, title: "Эксплуатируется в реальных атаках"}
      - {code: E2, score: 0.3, title: "Имеются сведения о наличии средств эксплуатации (эксплойта) уязвимости"}
      - {code: E3, score: 0.1, title: "Отсутствуют сведения об эксплуатации в реальных атаках (наличии эксплойта)"}
  - code: H
    group: imp
    weight_symbol: h
    weight: 1.0
    title: Последствия воздействий, которым подвергается информационная система при эксплуатации уязвимости
    multiple: max
    source: {clause: "17", table: "1", row: "5"}
    values:
      - {code: H1, score: 0.5, title: "Выполнение произвольного кода (Arbitrary Code Execution)"}
      - {code: H2, score: 0.5, title: "Повышение привилегий (Privilege Escalation)"}
      - {code: H3, score: 0.4, title: "Обход механизмов безопасности (Security Bypass)"}
      - {code: H4, score: 0.34, title: "Внедрение кода (Code Injection)"}
      - {code: H5, score: 0.3, title: "Получение конфиденциальной информации (Obtain Sensitive Information)"}
      - {code: H6, score: 0.3, title: "Нарушение целостности данных (Loss of Integrity)"}
      - {code: H7, score: 0.26, title: "Отказ в обслуживании (DoS)"}
      - {code: H8, score: 0.22, title: "Перезапись произвольных файлов (Overwrite Arbitrary Files)"}
      - {code: H9, score: 0.2, title: "Запись локальных файлов (Write Local Files)"}
      - {code: H10, score: 0.18, title: "Чтение локальных файлов (Read Local Files)"}
      - {code: H11, score: 0.12, title: "Поддельный пользовательский интерфейс (Spoof User Interface)"}
      - {code: H12, score: 0.1, title: "Межсайтовый скриптинг (Cross Site Scripting)"}

# Таблица 2 и сроки п. 21. Границы: min/max и признак включения границы.
levels:
  - code: critical
    title: Критический
    min: 8.0
    min_inclusive: false
    condition: V > 8,0
    deadline: {value: 24, unit: hours, text: "в течение нескольких часов (до 24 часов) с момента проведения оценки"}
    source: {clause: "18, 21", table: "2", row: "1"}
  - code: high
    title: Высокий
    min: 5.0
    min_inclusive: true
    max: 8.0
    max_inclusive: true
    condition: 5,0 ≤ V ≤ 8,0
    deadline: {value: 7, unit: days, text: "в течение нескольких дней (до 7 дней) с момента проведения оценки"}
    source: {clause: "18, 21", table: "2", row: "2"}
  - code: medium
    title: Средний
    min: 2.0
    min_inclusive: true
    max: 5.0
    max_inclusive: false
    condition: 2,0 ≤ V < 5,0
    deadline: {value: 4, unit: weeks, text: "в течение нескольких недель (до 4 недель) с момента проведения оценки"}
    source: {clause: "18, 21", table: "2", row: "3"}
  - code: low
    title: Низкий
    max: 2.0
    max_inclusive: false
    condition: V < 2,0
    deadline: {value: 4, unit: months, text: "в течение нескольких месяцев (до 4 месяцев) с момента проведения оценки"}
    source: {clause: "18, 21", table: "2", row: "4"}

# П. 4: уязвимостям сертифицированных СЗИ присваивается критический уровень.
certified_szi:
  level: critical
  text: >-
    Меры по устранению уязвимостей в сертифицированных программных,
    программно-аппаратных средствах защиты информации выполняются в сроки,
    установленные Методикой, с присвоением таким уязвимостям критического уровня
    (V > 8,0), а также в соответствии с эксплуатационной документацией на них и
    рекомендациями разработчика.
  source: {clause: "4"}

# П. 22–25: способы устранения и компенсирующие меры.
remediation:
  text: >-
    Уязвимости устраняются установкой обновления или принятием компенсирующих
    организационных и технических мер (п. 22). Обновления зарубежного и открытого
    ПО устанавливаются с учётом тестирования по Методике тестирования обновлений
    безопасности (п. 23). Если обновление невозможно получить, установить или
    протестировать, принимаются компенсирующие меры (п. 24); их выбирают с учётом
    структурно-функциональных характеристик системы и способов эксплуатации
    уязвимости (п. 25).
  source: {clause: "22–25"}

compensating_measures:
  source: {clause: "25"}
  items:
    - {code: CM1, title: "Изменение конфигурации уязвимых компонентов системы, в том числе в части исключения предоставления доступа к их функциям, исполнение которых может способствовать эксплуатации выявленных уязвимостей"}
    - {code: CM2, title: "Ограничение по использованию уязвимых программных, программно-аппаратных средств или их перевод в режим функционирования, ограничивающий исполнение функций, обращение к которым связано с использованием выявленных уязвимостей (например, отключение уязвимых служб и сетевых протоколов)"}
    - {code: CM3, title: "Резервирование компонентов системы, включая резервирование серверов, телекоммуникационного оборудования и каналов связи"}
    - {code: CM4, title: "Использование сигнатур, решающих правил средств защиты информации, обеспечивающих выявление в системе признаков эксплуатации уязвимостей"}
    - {code: CM5, title: "Мониторинг информационной безопасности и выявление событий безопасности информации в системе, связанных с возможностью эксплуатации уязвимостей"}

# Когда расчёт повторяется (используется в задаче 2.8).
recalculation:
  - {text: "Изменились сведения об эксплуатации уязвимости в БДУ ФСТЭК России", source: {clause: "16"}}
  - {text: "Изменились условия, влияющие на последствия эксплуатации уязвимости", source: {clause: "17"}}
  - {text: "Появились новые сведения об уязвимости (выпуск обновления, публикация эксплойта); пересчёт — на постоянной основе, по возможности автоматизированно", source: {clause: "19"}}

# Примеры приложения — контрольные расчёты: справочник считается исправным,
# только если оба воспроизводятся (проверяется при загрузке и правке).
examples:
  - code: example-1
    title: "Пример 1: BDU:2025-01611, FortiOS, повышение привилегий"
    bdu_id: BDU:2025-01611
    inputs: {cvss: "8.8", K: [K2], L: [L3], P: [P1], E: [E3], H: [H2]}
    expected: {i_infr: "0.9", v: "4.75", level: medium}
    source: {appendix: "1", note: "Пример 1"}
  - code: example-2
    title: "Пример 2: BDU:2025-03219, ingress-nginx, выполнение произвольного кода"
    bdu_id: BDU:2025-03219
    inputs: {cvss: "9.8", K: [K1, K5, K6, K7], L: [L1, L2, L3], P: [P1], E: [E2], H: [H1]}
    expected: {i_infr: "1.08", v: "8.47", level: critical}
    source: {appendix: "1", note: "Пример 2"}
