# Нормативные документы: что применяется и что заменено.
#
# Запись — документ с кодом, наименованием, датой утверждения, статусом
# (active — применяется, not_applicable — не применяется) и основанием статуса.
# Справочники «Аттестации» ссылаются на документы по коду. Документ, который не
# применяется, остаётся в списке, чтобы было видно, чем он заменён и на каком
# основании.
#
# origin: official — реквизиты взяты из официального текста, загруженного в
# проект (указано в source.note); stub — по памяти разработчика, требует сверки.
# Отметку о сверке ставит методист в интерфейсе («Справочники → Нормативные
# документы»).

